name: Bootstrap PulsePlay Source and Build APK

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-and-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore PulsePlay source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.small.* | base64 -d > /tmp/pulseplay-source.tar.zst
          tar --zstd -xf /tmp/pulseplay-source.tar.zst -C .
          rm -rf .bootstrap
          test -s index.android.html
          test -s android/app/src/main/java/com/pulseplay/player/MainActivity.java

      - name: Commit complete source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Add PulsePlay Android source and APK build setup'
            git push origin HEAD:main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build Android web bundle
        run: npm run build:android-web

      - name: Verify Android entry exists before Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/www/index.android.html
          echo 'Web bundle verified before APK build'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify packaged APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/www/index.android.html'
          cp "$APK" PulsePlay-v1.0.0.apk
          echo 'APK verified: assets/www/index.android.html is packaged'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlay-APK
          path: PulsePlay-v1.0.0.apk
          if-no-files-found: error

name: Build PulsePlay APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Android web assets
        run: npm run build:android-web
      - name: Verify Android assets
        run: |
          test -f android/app/src/main/assets/www/index.android.html
          test -d android/app/src/main/assets/www/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PulsePlay-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PulsePlay-APK
          path: PulsePlay-v1.0.0.apk
          if-no-files-found: error

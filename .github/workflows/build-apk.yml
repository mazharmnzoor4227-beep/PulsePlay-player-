name: Build PulsePlay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct PulsePlay source
        run: |
          cat source_chunks/part* | base64 --decode > PulsePlay-source-fixed.zip
          unzip -t PulsePlay-source-fixed.zip
          mkdir app
          unzip -q PulsePlay-source-fixed.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run packaging regression test
        working-directory: app
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: app
        run: gradle assembleDebug

      - name: Verify WebView bundle is inside APK
        run: unzip -l app/android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/index.android.html'

      - name: Prepare APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk PulsePlay-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PulsePlay-APK
          path: PulsePlay-v1.0.0.apk
          if-no-files-found: error
